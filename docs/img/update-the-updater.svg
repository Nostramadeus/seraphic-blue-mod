<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="900" height="330" rx="14" fill="#f3f7fa"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#155993"/></marker>
  </defs>

  <!-- Step 1: the ZIP -->
  <g transform="translate(20,20)">
    <circle cx="18" cy="18" r="16" fill="#155993"/><text x="18" y="24" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text>
    <text x="44" y="25" font-size="18" font-weight="700" fill="#182b40">Download, then Extract All</text>
    <rect x="0" y="50" width="260" height="190" rx="8" fill="#fff" stroke="#cedbe7"/>
    <rect x="0" y="50" width="260" height="30" rx="8" fill="#e4edf5"/><text x="12" y="70" font-size="13" fill="#52677d">Downloads</text>
    <!-- zip icon -->
    <rect x="20" y="100" width="34" height="42" rx="3" fill="#f2c94c" stroke="#b8941f"/><rect x="34" y="100" width="6" height="42" fill="#b8941f" opacity=".45"/>
    <text x="64" y="117" font-size="12.5" fill="#182b40">seraphic-blue-updater-</text>
    <text x="64" y="134" font-size="12.5" fill="#182b40">windows-v1.1.1.zip</text>
    <!-- context menu -->
    <rect x="70" y="150" width="170" height="72" rx="4" fill="#fff" stroke="#9fb3c6"/>
    <rect x="74" y="156" width="162" height="26" rx="3" fill="#d6e7f7"/>
    <text x="86" y="174" font-size="13.5" font-weight="700" fill="#182b40">Extract All…</text>
    <text x="86" y="206" font-size="13.5" fill="#52677d">Open with…</text>
    <text x="14" y="234" font-size="11.5" fill="#52677d">(right-click the ZIP)</text>
  </g>

  <line x1="290" y1="160" x2="318" y2="160" stroke="#155993" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: the extracted folder -->
  <g transform="translate(325,20)">
    <circle cx="18" cy="18" r="16" fill="#155993"/><text x="18" y="24" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2</text>
    <text x="44" y="25" font-size="18" font-weight="700" fill="#182b40">Open the new folder</text>
    <rect x="0" y="50" width="250" height="190" rx="8" fill="#fff" stroke="#cedbe7"/>
    <rect x="0" y="50" width="250" height="30" rx="8" fill="#e4edf5"/><text x="12" y="70" font-size="12.5" fill="#52677d">SeraphicBlue-Updater-v1.1.1</text>
    <g font-size="13" fill="#52677d">
      <path d="M16 96h10l3 4h15v14h-28z" fill="#f2c94c"/><text x="54" y="111">launchers</text>
      <path d="M16 122h10l3 4h15v14h-28z" fill="#f2c94c"/><text x="54" y="137">payload</text>
      <path d="M16 148h10l3 4h15v14h-28z" fill="#f2c94c"/><text x="54" y="163">source</text>
    </g>
    <rect x="8" y="176" width="234" height="32" rx="4" fill="#d6e7f7" stroke="#155993" stroke-width="2"/>
    <rect x="18" y="183" width="18" height="18" rx="3" fill="#155993"/><text x="27" y="197" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">S</text>
    <text x="46" y="197" font-size="13.5" font-weight="700" fill="#182b40">SeraphicBlue-Update.exe</text>
    <text x="14" y="232" font-size="11.5" fill="#52677d">(double-click it)</text>
  </g>

  <line x1="585" y1="160" x2="613" y2="160" stroke="#155993" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3: the updater window -->
  <g transform="translate(620,20)">
    <circle cx="18" cy="18" r="16" fill="#155993"/><text x="18" y="24" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3</text>
    <text x="44" y="25" font-size="18" font-weight="700" fill="#182b40">Pick your game</text>
    <rect x="0" y="50" width="260" height="190" rx="8" fill="#fff" stroke="#cedbe7"/>
    <rect x="0" y="50" width="260" height="30" rx="8" fill="#e4edf5"/><text x="12" y="70" font-size="12.5" fill="#52677d">Seraphic Blue - Update</text>
    <rect x="12" y="94" width="150" height="26" rx="2" fill="#fff" stroke="#9fb3c6"/><text x="18" y="112" font-size="11" fill="#52677d">…\SeraphicBlue-Altered</text>
    <rect x="170" y="92" width="78" height="30" rx="4" fill="#d6e7f7" stroke="#155993" stroke-width="2"/><text x="209" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#182b40">Choose…</text>
    <text x="12" y="142" font-size="11.5" fill="#52677d">= your game folder (has PLAY.cmd)</text>
    <rect x="12" y="160" width="140" height="34" rx="4" fill="#d6e7f7" stroke="#155993" stroke-width="2"/><text x="82" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#182b40">Update to latest</text>
    <rect x="180" y="160" width="68" height="34" rx="4" fill="#fff" stroke="#9fb3c6"/><text x="214" y="182" text-anchor="middle" font-size="13" fill="#52677d">Close</text>
    <text x="12" y="226" font-size="11.5" fill="#52677d">New copy appears next to the old one.</text>
  </g>

  <!-- Bottom note -->
  <rect x="20" y="276" width="860" height="38" rx="8" fill="#fff4e0" stroke="#d49317"/>
  <text x="38" y="300" font-size="14.5" fill="#5a3d00"><tspan font-weight="700">Any folder works.</tspan> No need to drag it into the game. Do not use the old <tspan font-weight="700">updater-v1.1</tspan> folder inside your game: it has the bug.</text>
</svg>
