<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">Reading an ability card: AR, AE, AC and AWT</title><desc id="desc">Example: AR Single means one target; AE dash means no listed element; AC dash means no field-element requirement; AWT plus120 means character ATKWT plus120 wait after acting. Example ATKWT300 makes420WT. A plain650 instead means650WT.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2328}.title{font-size:40px;font-weight:700}.head{font-size:31px;font-weight:700}.body{font-size:30px}.small{font-size:27px}.badge{font-size:34px;font-weight:700;fill:#0550ae}.game{font-size:32px;fill:#fff;font-family:monospace}.muted{fill:#59636e}.box{fill:#fff;stroke:#d0d7de;stroke-width:2}.line{stroke:#0969da;stroke-width:4;fill:none}</style><rect width="720" height="1080" rx="18" fill="#f6f8fa"/><text x="28" y="58" class="title">Reading an ability card</text><rect x="28" y="88" width="664" height="120" rx="12" fill="#123553"/><text x="50" y="135" class="game">AR: Single     AE: —</text><text x="50" y="182" class="game">AC: —          AWT: +120</text><rect x="28" y="238" width="664" height="120" rx="12" class="box"/><text x="46" y="278" class="badge">AR</text><text x="155" y="278" class="head">Ability Range</text><text x="46" y="315" class="body">Who the ability can target.</text><text x="46" y="347" class="body">Single = one target.</text><rect x="28" y="378" width="664" height="120" rx="12" class="box"/><text x="46" y="418" class="badge">AE</text><text x="155" y="418" class="head">Ability Element</text><text x="46" y="455" class="body">The element carried by the ability.</text><text x="46" y="487" class="body">— = no element listed.</text><rect x="28" y="518" width="664" height="120" rx="12" class="box"/><text x="46" y="558" class="badge">AC</text><text x="155" y="558" class="head">Ability Component</text><text x="46" y="595" class="body">Field elements needed to use it.</text><text x="46" y="627" class="body">— = no FE requirement.</text><rect x="28" y="658" width="664" height="120" rx="12" class="box"/><text x="46" y="698" class="badge">AWT</text><text x="155" y="698" class="head">Ability WT</text><text x="46" y="735" class="body">Wait added after using the ability.</text><text x="46" y="767" class="body">+120 = character ATKWT + 120.</text><rect x="28" y="810" width="664" height="236" rx="12" fill="#eef6ff" stroke="#0969da" stroke-width="2"/><text x="46" y="854" class="head">Read the + sign</text><text x="46" y="901" class="body">Example character ATKWT: 300</text><text x="46" y="945" class="head">AWT +120 → 300 + 120 = 420 WT</text><text x="46" y="991" class="body">AWT 650 → fixed 650 WT</text><text x="46" y="1030" class="small muted">These numbers are examples, not defaults.</text></svg>
