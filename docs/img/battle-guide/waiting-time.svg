<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc"><title id="title">WT and the next turn</title><desc id="desc">Waiting Time determines when a unit can act. At the left end of the WT line it can act; after acting it gains the action's waiting time. Example ATKWT300 plus AWT120 adds420WT. The icon moves left again at a speed determined by AGL. WT is not seconds.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2328}.title{font-size:40px;font-weight:700}.head{font-size:31px;font-weight:700}.body{font-size:30px}.small{font-size:27px}.badge{font-size:34px;font-weight:700;fill:#0550ae}.game{font-size:32px;fill:#fff;font-family:monospace}.muted{fill:#59636e}.box{fill:#fff;stroke:#d0d7de;stroke-width:2}.line{stroke:#0969da;stroke-width:4;fill:none}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#0969da"/></marker></defs><rect width="720" height="1000" rx="18" fill="#f6f8fa"/><text x="28" y="58" class="title">WT: when you can act again</text><text x="28" y="105" class="body muted">WT = Waiting Time</text><rect x="28" y="150" width="664" height="145" rx="12" class="box"/><circle cx="65" cy="191" r="23" fill="#eef6ff"/><text x="55" y="202" class="badge">1</text><text x="108" y="202" class="head">Reach your turn</text><text x="46" y="244" class="body">Your icon reaches the left end.</text><text x="46" y="281" class="body">Your unit can act.</text><path d="M360 300 V326" class="line" marker-end="url(#arrow)"/><rect x="28" y="340" width="664" height="145" rx="12" class="box"/><circle cx="65" cy="381" r="23" fill="#eef6ff"/><text x="55" y="392" class="badge">2</text><text x="108" y="392" class="head">Use an ability</text><text x="46" y="434" class="body">Example: the card says AWT +120.</text><text x="46" y="471" class="body">Example character ATKWT: 300.</text><path d="M360 490 V516" class="line" marker-end="url(#arrow)"/><rect x="28" y="530" width="664" height="145" rx="12" class="box"/><circle cx="65" cy="571" r="23" fill="#eef6ff"/><text x="55" y="582" class="badge">3</text><text x="108" y="582" class="head">Add the action’s wait</text><text x="46" y="624" class="body">300 + 120 = 420 WT.</text><text x="46" y="661" class="body">Your icon moves right by that wait.</text><path d="M360 680 V706" class="line" marker-end="url(#arrow)"/><rect x="28" y="720" width="664" height="145" rx="12" class="box"/><circle cx="65" cy="761" r="23" fill="#eef6ff"/><text x="55" y="772" class="badge">4</text><text x="108" y="772" class="head">Wait for the next turn</text><text x="46" y="814" class="body">The icon moves left again.</text><text x="46" y="851" class="body">AGL controls how fast it moves.</text><text x="28" y="928" class="head">More wait → later next turn</text><text x="28" y="975" class="body muted">WT is battle timing, not real-time seconds.</text></svg>
